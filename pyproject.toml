[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-race-medical-kg"
version = "0.1.0"
description = "Hybrid Track A pipeline for Ontological Reasoning in Medical Knowledge Retrieval"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.103.2",
  "pydantic>=1.10.13,<2",
  "uvicorn[standard]==0.23.2",
  "httpx>=0.25.0",
  "openai>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
ai-race-run = "services.pipeline:main"
