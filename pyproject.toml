[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medkg"
version = "0.1.0"
description = "Deterministic baseline for Ontological Reasoning in Medical Knowledge Retrieval"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.103.2",
  "pydantic<2",
  "uvicorn==0.23.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
medkg-run = "medkg.pipeline:main"
medkg-submit = "medkg.submit:main"
