services:
  ai-race-api:
    build:
      context: .
    image: ai-race-medical-kg:latest
    container_name: ai-race-api
    environment:
      API_KEY: ${API_KEY:-}
      BASE_URL: ${BASE_URL:-http://10.221.58.70:8402}
      MODEL: ${MODEL:-thangnv108}
      TEMPERATURE: ${TEMPERATURE:-0}
      MAX_TOKENS: ${MAX_TOKENS:-4096}
      TIMEOUT: ${TIMEOUT:-120}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    volumes:
      - ./input:/app/input:ro
      - ./output:/app/output
      - ./data/candidates:/app/data/candidates:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  ai-race-runner:
    build:
      context: .
    image: ai-race-medical-kg:latest
    profiles:
      - run
    depends_on:
      ai-race-api:
        condition: service_healthy
    environment:
      API_KEY: ${API_KEY:-}
      BASE_URL: ${BASE_URL:-http://10.221.58.70:8402}
      MODEL: ${MODEL:-thangnv108}
      TEMPERATURE: ${TEMPERATURE:-0}
      MAX_TOKENS: ${MAX_TOKENS:-4096}
      TIMEOUT: ${TIMEOUT:-120}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./input:/app/input:ro
      - ./output:/app/output
      - ./data/candidates:/app/data/candidates:ro
    command:
      [
        "python",
        "tests/test.py",
        "input",
        "--url",
        "http://ai-race-api:8000",
        "--output-dir",
        "output",
      ]
